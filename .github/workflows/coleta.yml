name: Ronda diária das fontes
on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"   # todo dia, 4h17 no horário de Brasília
  push:
    paths:
      - "ferramentas/coleta/coletar.py"
      - "ferramentas/coleta/plataformas.py"
      - "ferramentas/coleta/triagem_sympla.py"
      - "ferramentas/coleta/agendas.py"
      - ".github/workflows/coleta.yml"
permissions:
  contents: write
  issues: write
concurrency:
  group: publicacao
  cancel-in-progress: false
jobs:
  ronda:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 ferramentas/coleta/coletar.py
      - name: Extração das plataformas de ingresso (Ingresso.com e Sympla)
        run: |
          python3 ferramentas/coleta/plataformas.py coleta-bruta && python3 ferramentas/coleta/triagem_sympla.py coleta-bruta || echo "extração das plataformas falhou; a ronda segue"
      - name: Agendas dedicadas (Sesc RJ e Arte que Acontece)
        run: |
          python3 ferramentas/coleta/agendas.py coleta-bruta || echo "ALARME: as agendas dedicadas (Sesc, Arte que Acontece) falharam" >> alarmes.txt
      - name: Guardar o texto bruto num ramo temporário (fora do site e da linha principal; substituído a cada ronda)
        run: |
          cd coleta-bruta
          cat > LEIA-ME.md <<'FIM'
          # Texto bruto da ronda das fontes (temporário)

          Cópia de trabalho do que o LargoBot leu em sites públicos de espaços culturais do Rio.
          Serve só para a redação e a conferência das fichas do Largo e é substituída a cada ronda.
          Os textos pertencem aos respectivos sites e NÃO estão sob as licenças abertas do projeto.
          FIM
          git init -q -b coleta-bruta
          git config user.name "largo-coleta"
          git config user.email "largo-coleta@users.noreply.github.com"
          git add -A
          git commit -qm "Texto bruto da ronda (temporário; substituído a cada ronda)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" coleta-bruta
      - name: Montar a edição do dia, o boletim de saúde e publicar o site (robô, sem IA)
        run: bash ferramentas/publicar.sh "Ronda das fontes e site do dia (automático)" coleta-bruta/plataformas.json
      - name: Alarme por e-mail (aviso no GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          aberto=$(gh issue list --state open --search "Alarme do robô in:title" --json number --jq '.[0].number')
          if grep -q "ALARME" alarmes.txt 2>/dev/null; then
            corpo=$(printf "O robô do Todos os Rios encontrou um problema na rodada de hoje:\n\n%s\n\nO que fazer: abrir uma conversa no Projeto e colar este aviso. Detalhes em dados/coleta/saude.md." "$(grep ALARME alarmes.txt | sed 's/^ALARME: /- /')")
            if [ -n "$aberto" ]; then gh issue comment "$aberto" --body "$corpo"; else gh issue create --title "Alarme do robô: $(date -u +%d/%m)" --body "$corpo"; fi
          elif [ -n "$aberto" ]; then
            gh issue close "$aberto" --comment "Resolvido: a rodada de hoje terminou sem alarmes."
          fi
