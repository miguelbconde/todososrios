name: Diagnóstico de alcance das fontes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 ferramentas/coleta/diagnostico.py
      - name: Guardar o resultado no repositório
        run: |
          git config user.name "todososrios-robo"
          git config user.email "todososrios-robo@users.noreply.github.com"
          git add dados/coleta/diagnostico.json dados/coleta/diagnostico.md
          git commit -m "Diagnóstico de alcance das fontes (automático)" || echo "nada mudou"
          git pull --rebase origin main
          git push origin HEAD:main
