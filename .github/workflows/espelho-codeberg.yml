name: Cópia de segurança no Codeberg
# Envia a linha principal (main) do repositório para um espelho no Codeberg, plataforma sem fins lucrativos.
# Roda a cada mudança enviada à main, uma vez por dia (porque as publicações do robô não disparam
# outras automações) e quando alguém aperta o botão. Só a main vai: o ramo coleta-bruta guarda textos
# de terceiros e fica de fora.
# Precisa do segredo CODEBERG_TOKEN (chave de acesso do Codeberg com permissão de escrita em repositórios).
# Opcional: variável CODEBERG_REPO (padrão: miguelbconde/todososrios). Sem o segredo, não faz nada.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "23 11 * * *"   # todo dia, 8h23 no horário de Brasília, depois da publicação da manhã
permissions:
  contents: read
concurrency:
  group: espelho-codeberg
  cancel-in-progress: true
jobs:
  espelhar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      REPO: ${{ vars.CODEBERG_REPO || 'miguelbconde/todososrios' }}
    steps:
      - name: Conferir se a chave do Codeberg existe
        id: chave
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Segredo CODEBERG_TOKEN ainda não cadastrado: nada a fazer." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=nao" >> "$GITHUB_OUTPUT"
          else
            echo "ok=sim" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chave.outputs.ok == 'sim'
        with:
          ref: main
          fetch-depth: 0
      - name: Enviar ao Codeberg
        if: steps.chave.outputs.ok == 'sim'
        run: |
          DONO="${REPO%%/*}"
          git push --force "https://${DONO}:${TOKEN}@codeberg.org/${REPO}.git" HEAD:refs/heads/main
          echo "Espelho atualizado: https://codeberg.org/${REPO}" >> "$GITHUB_STEP_SUMMARY"
